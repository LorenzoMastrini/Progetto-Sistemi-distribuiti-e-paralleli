<app-not-found [visible]="!orders"
                notFoundMessage="Non hai ancora effettuato ordini!"
                resetLinkText="Torna alla Homepage">
</app-not-found>

<div *ngIf="orders" class="container">
    <!--
    <div class="order-info">
        {{ order.userId }}
        {{ order.movieTime }}
        {{ order.seats }}
    </div>
    -->
    <table class="schedules-list">
        <tr>
            <td colspan="2">
                <h3>I tuoi ordini:</h3>
            </td>
        </tr>

        <tr>
            <td>
                <h4>Orario</h4>
            </td>
            <td>
                <h4>Posti prenotati</h4>
            </td>
        </tr>

        <tr *ngFor="let order of orders">
            <td>
                {{ order.movieTime }}
            </td>
            <td>
                {{ order.seats }}
            </td>
        </tr>
    </table>
