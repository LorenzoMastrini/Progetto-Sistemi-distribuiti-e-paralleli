<app-not-found [visible]="!films || !films.length"
                resetLinkText="Torna alla home">
</app-not-found>

<ul>
    <li *ngFor="let film of films">
        <!--uso [] per dati dinamici-->
        <a routerLink="/film/{{film.name}}">
            <img [src]="film.imgUrl"/>
            
            <div class="info">
                <div class="name">
                    <span>
                        {{film.name}}
                    </span>
                </div>
                <div class="director">
                    <span>
                        <strong>Regista: </strong>{{film.director}}
                    </span>
                </div>
                <!--
                <div class="genres">
                    <span>
                        <strong>Genere: </strong>{{film.genres}}
                    </span>
                </div>
                -->
                <div class="duration">
                    <span>
                        <strong>Durata: </strong>{{film.duration}} min
                    </span>
                </div>

                <button>
                    Prenota
                </button>
            </div>
        </a>
    </li>
</ul>
