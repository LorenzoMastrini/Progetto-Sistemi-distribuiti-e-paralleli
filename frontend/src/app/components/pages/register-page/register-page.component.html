<div class="container">
    <div class="details">
        <app-title title="Registrazione"></app-title>

        <form [formGroup]="registerForm" (ngSubmit)="submit()">
            <text-input
                [control]="fc.name"
                [showErrorsWhen]="isSubmitted"
                label="Nome">
            </text-input>

            <text-input
                [control]="fc.email"
                [showErrorsWhen]="isSubmitted"
                label="Email"
                type="email">
            </text-input>

            <text-input
                [control]="fc.password"
                [showErrorsWhen]="isSubmitted"
                label="Password"
                type="password">
            </text-input>

            <default-button text="Registrati"></default-button>

            <div class="login">
                Già un utente? &nbsp;
                <a routerLink="/login" [queryParams]="{returnUrl: returnUrl}">
                    Login
                </a>
            </div>
        </form>
    </div>
</div>
