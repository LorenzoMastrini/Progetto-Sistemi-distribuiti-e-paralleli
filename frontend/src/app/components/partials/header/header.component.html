<header>
    <div class="container">
        <a *ngIf="user.isAdmin" routerLink="/admin" class="logo">Kinetoscope</a>
        <a *ngIf="!user.isAdmin or user == undefined" routerLink="/" class="logo">Kinetoscope</a>
        
        <nav>
            <ul>
                <!--mostro il pulsante login solo se l'utente non è autenticato-->
                <li *ngIf="!isAuth">
                    <a routerLink="/login">Login</a>
                </li>

                <!--mostro il menu utente solo se l'utente è autenticato-->
                <li *ngIf="isAuth" class="menu-container">
                    <a routerLink="/dashboard">{{ user.name }}</a>
                    <div class="menu">
                        <a *ngIf="!user.isAdmin" routerLink="users/orders/{{user.token}}">Ordini</a>
                        <a *ngIf="user.isAdmin" routerLink="/admin/orders">Ordini</a>
                        <a *ngIf="user.isAdmin" routerLink="/admin/users">Utenti</a>
                        <a (click)="logout()">Logout</a>
                    </div>
                </li>
            </ul>
        </nav>
    </div>
</header>
